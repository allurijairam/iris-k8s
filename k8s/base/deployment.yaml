apiVersion: apps/v1
kind: Deployment
metadata:
  name: irisk8s
  labels:
    app: irisk8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: irisk8s
  template:
    metadata:
      labels:
        app: irisk8s
    spec:
      containers:
        - name: iris-classifier
          image: ghcr.io/allurijairam/iris-classifier
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10